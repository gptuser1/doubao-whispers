name: Whisper Runner

on:
  schedule:
    # Every 25 minutes. The script enforces Beijing-time active hours
    # (7:00-23:00) and per-task min_interval_minutes gates, so a denser cron
    # just lets those gates fire closer to on-time instead of being rounded
    # up to the next hour.
    - cron: '*/25 * * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_publish:
        description: 'Force publish'
        required: false
        default: false
        type: boolean
      force_model_pool:
        description: 'Force refresh model pool regardless of staleness'
        required: false
        default: false
        type: boolean
      author:
        description: 'Author'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'
          - doubao
          - guga
          - doro
          - feibi
          - baizi
          - nuonuo

# Serialize runs: only one runner at a time. Without this, a cron run and a
# manual trigger (or two overlapping crons) can both checkout the same base,
# modify the same JSON files, and then fight on push — the loser hits a
# non-fast-forward rejection and, with JSON files, a real rebase conflict it
# can't auto-resolve. Queuing (cancel-in-progress: false) lets the in-flight
# run finish cleanly so the next run checks out a base that already includes
# its changes.
concurrency:
  group: whisper-runner
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install Pillow requests

      - name: Run zen fingerprint probe
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          python .whisper-task/scripts/probe_zen_fingerprint.py \
            --models ling-3.0-flash-fin-free mimo-v2.5-free \
                    nemotron-3.5-lightning-free nemotron-3-ultra-free \
                    deepseek-v4-flash-free muse-spark-1.3-contributor-free \
                    muse-spark-1.2-contributor-free
