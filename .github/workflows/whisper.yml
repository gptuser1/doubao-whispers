name: Whisper Runner

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      author:
        description: 'Author'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run real-scenario probe
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python .whisper-task/scripts/probe_groq.py \
            --models qwen/qwen3.8-27b openai/gpt-oss-120b \
            --api-key-env GROQ_API_KEY \
            --max-tokens 6500 \
            --temperature 0.7 \
            --reasoning-effort medium \
            --reasoning-format hidden
          python .whisper-task/scripts/probe_groq.py \
            --models qwen/qwen3.6-27b \
            --api-key-env GROQ_API_KEY \
            --max-tokens 6500 \
            --temperature 0.7 \
            --reasoning-effort default \
            --reasoning-format hidden

      - name: Probe big-pickle chat/completions with UA variants
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          python .whisper-task/scripts/probe_zen.py \
            --endpoint chat --models big-pickle --max-output-tokens 512

      - name: Probe opencode zen contributor models (Responses API ACK)
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          # default effort=high: known to burn the whole budget on thinking (empty output)
          python .whisper-task/scripts/probe_zen.py \
            --models muse-spark-1.3-contributor-free muse-spark-1.2-contributor-free \
            --max-output-tokens 1024
          # low effort: short outputs should survive thinking
          python .whisper-task/scripts/probe_zen.py \
            --models muse-spark-1.3-contributor-free muse-spark-1.2-contributor-free \
            --max-output-tokens 1024 --reasoning-effort low
          # none: reasoning off entirely
          python .whisper-task/scripts/probe_zen.py \
            --models muse-spark-1.3-contributor-free muse-spark-1.2-contributor-free \
            --max-output-tokens 1024 --reasoning-effort none