name: Whisper Runner

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      author:
        description: 'Author'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ACK big-pickle via real pool ack_probe (UA variants)
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          python .whisper-task/scripts/probe_pool_ack.py \
            --models big-pickle \
            --user-agent "opencode/1.15.0 ai-sdk/provider-utils/4.0.23 runtime/bun/1.3.13" \
            --user-agent "opencode/1.15.0"