name: Whisper Runner

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:
    inputs:
      author:
        description: 'Author'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Verify dual-endpoint ack_probe (completions -> responses fallback)
        env:
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
        run: |
          # muse-spark: served only on /responses, should pass via fallback
          python .whisper-task/scripts/probe_pool_ack.py \
            --models muse-spark-1.3-contributor-free
          # big-pickle: disabled model, must fail on both endpoints
          python .whisper-task/scripts/probe_pool_ack.py --models big-pickle